name: Temporary volunteer exhaustive analysis validator

# Trigger rerun after workflow registration on main.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-volunteer-exhaustive-45s.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/volunteer-exhaustive-45s-20260823
          fetch-depth: 0
      - name: Apply targeted patch
        run: python .github/scripts/patch-volunteer-exhaustive-45s.py
      - name: Validate syntax
        run: |
          node --check atlas/js/atlas-app.js
          node --check atlas/js/volunteer-coverage.js
          node --check atlas/js/volunteer-night-guard.js
      - name: Validate behavior markers
        run: |
          grep -q "const watchdogMs=45000" atlas/js/volunteer-coverage.js
          ! grep -q "Da verificare" atlas/js/volunteer-coverage.js
          ! grep -q "status:'REVIEW'" atlas/js/volunteer-coverage.js
          ! grep -q "searchDeadline" atlas/js/atlas-app.js
          ! grep -q "maxExplored=700" atlas/js/atlas-app.js
          grep -q "\['118','OP','SE'\]" atlas/js/atlas-app.js
      - name: Commit application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/js/atlas-app.js atlas/js/volunteer-coverage.js
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "ATLAS: exhaustive volunteer analysis with 45s watchdog"
          git push origin HEAD:atlas/volunteer-exhaustive-45s-20260823
