name: Temporary Admin shift and permit rules validator

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/patch-admin-shift-permit-rules.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/admin-shift-permit-rules-20260907
          fetch-depth: 0
      - name: Apply targeted patch
        run: python .github/scripts/patch-admin-shift-permit-rules.py
      - name: Validate JavaScript
        run: |
          node --check atlas/js/atlas-app.js
          node --check atlas/js/config.js
          node --check atlas/js/ccnl-rules.js
      - name: Validate behavior markers
        run: |
          grep -q "id=\"settingsShiftTimes\"" admin.html
          grep -q "data-shift-template=\"WD_M\"" admin.html
          grep -q "configuredShiftTemplate" atlas/js/atlas-app.js
          grep -q "shiftTemplates" atlas/js/config.js
          grep -q "personalPermitDailyMaxRatio" atlas/js/atlas-app.js
          grep -q "seriousReasonsMaxDaysAnnual" atlas/js/atlas-app.js
          grep -q "bereavementEventWindowDays" atlas/js/atlas-app.js
          ! grep -q "holidayRecoveryDays:30};" atlas/js/atlas-app.js
      - name: Commit application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html ro.html atlas/js/atlas-app.js atlas/js/config.js atlas/css/core.css
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "ATLAS: make shift hours and permit rules configurable"
          git push origin HEAD:atlas/admin-shift-permit-rules-20260907
