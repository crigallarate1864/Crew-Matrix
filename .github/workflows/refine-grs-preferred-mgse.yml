name: Refine GRS and preferred MGSE quota

on:
  push:
    branches:
      - atlas/mgse-settings-coverage-20260823
    paths:
      - .github/workflows/refine-grs-preferred-mgse.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/mgse-settings-coverage-20260823
          fetch-depth: 0

      - name: Apply ATLAS refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # config.js
          p=Path('atlas/js/config.js')
          s=p.read_text(encoding='utf-8')
          old="""    seTarget: 2,\n    sePreferredEmployeeId: '', \n    respMin: 4,"""
          new="""    seTarget: 2,\n    sePreferredEmployeeId: '',\n    sePreferredMinDays: 0,\n    sePreferredMaxDays: 31,\n    respMin: 4,"""
          if old not in s:
              raise SystemExit('config preferred marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # atlas-app.js
          p=Path('atlas/js/atlas-app.js')
          s=p.read_text(encoding='utf-8')
          old="""    'seTarget',\n    'sePreferredEmployeeId',\n    'respMin',"""
          new="""    'seTarget',\n    'sePreferredEmployeeId',\n    'sePreferredMinDays',\n    'sePreferredMaxDays',\n    'respMin',"""
          if old not in s:
              raise SystemExit('shared setting marker not found')
          s=s.replace(old,new,1)

          # Give the preferred MGSE employee a real soft advantage in SE candidate scoring.
          old="""    if(item.role==='S'){if(!e.autista&&!e.capo)score-=8;else score+=2;}\n    // La continuità di sede è solo una preferenza. Nei retry di copertura viene azzerata."""
          new="""    if(item.role==='S'){if(!e.autista&&!e.capo)score-=8;else score+=2;}\n    if(item.category==='SE'&&String(state.settings.sePreferredEmployeeId||'')===String(e.id||''))score-=24;\n    // La continuità di sede è solo una preferenza. Nei retry di copertura viene azzerata."""
          if old not in s:
              raise SystemExit('candidate score marker not found')
          s=s.replace(old,new,1)

          # Replace Secondari scheduling. GRS is never converted to MGSE: it can only be released by 118 fallback.
          pattern=r"  function scheduleSecondari\(\)\{.*?(?=\n  function currentSlotOccupied)"
          replacement=r'''  function preferredSecondariDayCount(employeeId){
    if(!employeeId)return 0;
    return workdays().reduce((count,d)=>{
      const day=dateKey(d);
      return count+(getAssignments(employeeId,day).some(a=>a.category==='SE')?1:0);
    },0);
  }
  function ordinarySecondariPreferredEmployee(){
    const id=String(state.settings.sePreferredEmployeeId||'');
    const employee=id?state.employees.find(e=>e.id===id):null;
    if(!employee)return null;
    if(!['A','B','Libera'].includes(employee.turno))return null;
    if(slug(employee.responsabile)==='secondari')return null;
    return employee;
  }
  function scheduleSecondari(){
    let added=0;
    const preferredEmployee=ordinarySecondariPreferredEmployee();
    const preferredMin=Math.max(0,Math.min(31,numeric(state.settings.sePreferredMinDays,0)));
    const preferredMax=Math.max(preferredMin,Math.min(31,numeric(state.settings.sePreferredMaxDays,31)));
    let preferredDays=preferredEmployee?preferredSecondariDayCount(preferredEmployee.id):0;

    workdays().forEach(d=>{
      const day=dateKey(d);
      let count=state.employees.reduce((n,e)=>n+getAssignments(e.id,day).filter(a=>a.category==='SE').length,0);
      const target=2;
      const item={category:'SE',type:'MGSE',code:'MGSE'};
      const pref=preferredGroup(d,'M');

      // Finché non raggiunge il minimo mensile, il prevalente viene provato per primo.
      if(count<target&&preferredEmployee&&preferredDays<preferredMin&&employeeActiveOn(preferredEmployee,day)){
        const preferredItem={...item,preferredSecondari:true,note:'Dipendente prevalente Secondari · quota minima mensile'};
        const check=checkCandidate(preferredEmployee,day,preferredItem);
        if(!check.errors.length){
          addAuto(preferredEmployee,day,preferredItem);
          added++;
          count++;
          preferredDays++;
        }
      }

      while(count<target){
        const preferredAtMax=preferredEmployee&&preferredDays>=preferredMax;
        const allowed=e=>!preferredAtMax||e.id!==preferredEmployee.id;
        let pool=state.employees.filter(e=>(e.turno===pref||e.turno==='Libera')&&allowed(e));
        let employee=chooseCandidate(day,item,{preferred:pref,pool});
        if(!employee){
          pool=state.employees.filter(e=>['A','B','Libera'].includes(e.turno)&&allowed(e));
          employee=chooseCandidate(day,item,{preferred:pref,pool});
        }
        if(!employee)break;
        addAuto(employee,day,{...item,preferredSecondari:preferredEmployee?.id===employee.id});
        added++;
        count++;
        if(preferredEmployee?.id===employee.id)preferredDays++;
      }

      // Nessun fallback GRS -> MGSE: il Responsabile Secondari resta GRS.
      // Se le risorse ordinarie non bastano, MGSE può rimanere sotto 2 perché il 118 ha priorità.
    });
    return added;
  }
'''
          s,count=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if count!=1:
              raise SystemExit(f'scheduleSecondari replacement count={count}')

          # Monthly validation for preferred MGSE quota.
          marker="""    monthDates().forEach(d=>{const day=dateKey(d);['M','P','N'].forEach(shift=>{if(state.requirements[`${day}|${shift}`]!=='required')return;const cov=coverageFor(day,shift);"""
          insert="""    const preferredSeEmployee=ordinarySecondariPreferredEmployee();
    if(preferredSeEmployee){
      const preferredDays=preferredSecondariDayCount(preferredSeEmployee.id);
      const preferredMin=Math.max(0,Math.min(31,numeric(state.settings.sePreferredMinDays,0)));
      const preferredMax=Math.max(preferredMin,Math.min(31,numeric(state.settings.sePreferredMaxDays,31)));
      if(preferredDays<preferredMin)out.push(validation('warning','Prevalente Secondari sotto il minimo',`${employeeName(preferredSeEmployee)}: ${preferredDays} giornate MGSE, minimo configurato ${preferredMin}.`,preferredSeEmployee.id,null));
      if(preferredDays>preferredMax)out.push(validation('warning','Prevalente Secondari oltre il massimo',`${employeeName(preferredSeEmployee)}: ${preferredDays} giornate MGSE, massimo configurato ${preferredMax}.`,preferredSeEmployee.id,null));
    }
    monthDates().forEach(d=>{const day=dateKey(d);['M','P','N'].forEach(shift=>{if(state.requirements[`${day}|${shift}`]!=='required')return;const cov=coverageFor(day,shift);"""
          if marker not in s:
              raise SystemExit('validation insertion marker not found')
          s=s.replace(marker,insert,1)

          # Open settings: populate quotas and only offer ordinary staff, never RS/RO/Admin.
          old="""    preferred.innerHTML='<option value=\"\">Nessuna preferenza</option>'+state.employees\n      .filter(e=>e.attivo!==false&&e.turno!=='Amministrazione')"""
          new="""    preferred.innerHTML='<option value=\"\">Nessuna preferenza</option>'+state.employees\n      .filter(e=>e.attivo!==false&&['A','B','Libera'].includes(e.turno)&&slug(e.responsabile)!=='secondari')"""
          if old not in s:
              raise SystemExit('preferred dropdown marker not found')
          s=s.replace(old,new,1)
          old="""    preferred.value=String(state.settings.sePreferredEmployeeId||'');\n\n    const note=$('#settingsPermissionNote');"""
          new="""    preferred.value=String(state.settings.sePreferredEmployeeId||'');
    $('#setSePreferredMinDays').value=Math.max(0,Math.min(31,numeric(state.settings.sePreferredMinDays,0)));
    $('#setSePreferredMaxDays').value=Math.max(0,Math.min(31,numeric(state.settings.sePreferredMaxDays,31)));

    const note=$('#settingsPermissionNote');"""
          if old not in s:
              raise SystemExit('openSettings quota marker not found')
          s=s.replace(old,new,1)
          s=s.replace(
            "note.innerHTML=isRo?'<strong>Profilo Responsabile Operativo:</strong> puoi scegliere il dipendente prevalente MGSE. Gli altri parametri sono visibili in sola lettura.':'';",
            "note.innerHTML=isRo?'<strong>Profilo Responsabile Operativo:</strong> puoi scegliere il dipendente prevalente MGSE. Minimo e massimo mensile sono definiti dall’Admin e restano in sola lettura.':'';",
            1
          )

          # Save settings with quota, and validate min <= max.
          old="""      sePreferredEmployeeId:\n        $('#setSePreferredEmployee')?.value||'',\n      respMin:"""
          new="""      sePreferredEmployeeId:
        $('#setSePreferredEmployee')?.value||'',
      sePreferredMinDays:
        Math.max(0,Math.min(31,numeric($('#setSePreferredMinDays').value,0))),
      sePreferredMaxDays:
        Math.max(0,Math.min(31,numeric($('#setSePreferredMaxDays').value,31))),
      respMin:"""
          if old not in s:
              raise SystemExit('saveSettings preferred quota marker not found')
          s=s.replace(old,new,1)

          validation_marker="""    if(nextSettings.respMin>nextSettings.respGoal){"""
          validation_block="""    if(nextSettings.sePreferredMinDays>nextSettings.sePreferredMaxDays){
      toast(
        'Impostazioni non valide',
        'Dipendente prevalente Secondari: le giornate minime non possono superare le massime.',
        'error'
      );
      return;
    }

    if(nextSettings.respMin>nextSettings.respGoal){"""
          if validation_marker not in s:
              raise SystemExit('settings validation marker not found')
          s=s.replace(validation_marker,validation_block,1)

          # RO local settings must preserve admin quota values while only changing the person.
          old="""      state.settings={...state.settings,seMin:2,seMax:2,seTarget:2,sePreferredEmployeeId:nextSettings.sePreferredEmployeeId};"""
          new="""      state.settings={...state.settings,seMin:2,seMax:2,seTarget:2,sePreferredEmployeeId:nextSettings.sePreferredEmployeeId,sePreferredMinDays:numeric(state.settings.sePreferredMinDays,0),sePreferredMaxDays:numeric(state.settings.sePreferredMaxDays,31)};"""
          if old not in s:
              raise SystemExit('RO local settings marker not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          # HTML admin + RO: add quota fields, update GRS wording, update cache busting.
          for name in ['admin.html','ro.html']:
            p=Path(name)
            s=p.read_text(encoding='utf-8')
            old='''              <div class="field full">\n                <label>Dipendente prevalentemente assegnato ai Secondari</label>\n                <select id="setSePreferredEmployee" class="input"><option value="">Nessuna preferenza</option></select>\n                <small>È una preferenza soft: ferie, riposi, vincoli e soprattutto la copertura 118 hanno priorità. Se necessario, il dipendente può essere utilizzato nel 118.</small>\n              </div>'''
            new='''              <div class="field full">\n                <label>Dipendente prevalentemente assegnato ai Secondari</label>\n                <select id="setSePreferredEmployee" class="input"><option value="">Nessuna preferenza</option></select>\n                <small>È una preferenza soft: ferie, riposi, vincoli e soprattutto la copertura 118 hanno priorità. Se necessario, il dipendente può essere utilizzato nel 118.</small>\n              </div>\n              <div class="field"><label>Giornate MGSE minime · prevalente</label><input id="setSePreferredMinDays" class="input" type="number" min="0" max="31" step="1" /></div>\n              <div class="field"><label>Giornate MGSE massime · prevalente</label><input id="setSePreferredMaxDays" class="input" type="number" min="0" max="31" step="1" /></div>\n              <div class="field full"><small>Solo l’Admin può modificare minimo e massimo mensile. Il RO può scegliere il dipendente prevalente, ma non cambiare le quote.</small></div>'''
            if old not in s:
                raise SystemExit(f'{name}: preferred HTML marker not found')
            s=s.replace(old,new,1)
            s=s.replace(
              'Le giornate GRS, GRA, GRM e GRO restano responsabilità finché il 118 è coperto; possono essere convertite dal fallback emergenziale quando servono a chiudere un ruolo 118.',
              'GRS viene pianificato in tutti i feriali compatibili con assenze e riposi obbligatori. Non viene usato per colmare MGSE: può essere convertito esclusivamente in 118 quando il fallback serve a chiudere una copertura. GRA, GRM e GRO seguono lo stesso principio di priorità 118.',
              1
            )
            s=s.replace(
              'Raschi svolge GRS; MGSE solo quando il minimo SE non è raggiungibile.',
              'Raschi svolge GRS nei feriali; viene liberato dalla responsabilità esclusivamente quando serve come risorsa di fallback 118.',
              1
            )
            s=s.replace('atlas/js/atlas-app.js?v=1.0.0-MGSE-COVERAGE-20260823','atlas/js/atlas-app.js?v=1.0.0-GRS-MGSE-QUOTA-20260823')
            p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax and behavior markers
        run: |
          node --check atlas/js/config.js
          node --check atlas/js/atlas-app.js
          grep -q "sePreferredMinDays" atlas/js/config.js
          grep -q "sePreferredMaxDays" atlas/js/atlas-app.js
          grep -q "Nessun fallback GRS -> MGSE" atlas/js/atlas-app.js
          grep -q "Giornate MGSE minime" admin.html
          grep -q "Giornate MGSE massime" ro.html
          ! grep -q "Responsabile Secondari impiegato operativamente per necessità" atlas/js/atlas-app.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/js/config.js atlas/js/atlas-app.js admin.html ro.html
          git commit -m "ATLAS: keep GRS daily and add preferred MGSE quotas"
          git pull --rebase origin atlas/mgse-settings-coverage-20260823
          git push origin HEAD:atlas/mgse-settings-coverage-20260823
