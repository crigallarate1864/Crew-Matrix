name: Temporary Admin full settings validator

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/patch-admin-full-settings-ui.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/admin-full-settings-ui-20260907
          fetch-depth: 0
      - name: Apply targeted patch
        run: python .github/scripts/patch-admin-full-settings-ui.py
      - name: Validate JavaScript
        run: |
          node --check atlas/js/atlas-app.js
          node --check atlas/js/config.js
          node --check atlas/js/ccnl-rules.js
      - name: Validate settings UI
        run: |
          grep -q "settings-menu-grid" admin.html
          grep -q "settings-menu-grid" ro.html
          grep -q "setPersonalPermitRecoveryMonths" admin.html
          grep -q "setAutoCompensatoryRestDefault" admin.html
          grep -q "Math.max(1,Math.round(numeric(state.settings.holidayRecoveryDays,30)))" atlas/js/atlas-app.js
          ! grep -q "setHolidayRecoveryDays').value=30" atlas/js/atlas-app.js
      - name: Commit application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html ro.html atlas/js/atlas-app.js atlas/css/core.css
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "ATLAS: give Admin full operational settings control"
          git push origin HEAD:atlas/admin-full-settings-ui-20260907
