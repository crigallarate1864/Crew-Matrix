name: Validate volunteer night exclusion safe

on:
  push:
    branches:
      - atlas/volunteer-night-exclusion-safe-20260823

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/volunteer-night-exclusion-safe-20260823
          fetch-depth: 0

      - name: Patch volunteer night constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('atlas/js/atlas-app.js')
          s=p.read_text(encoding='utf-8')
          marker='ATLAS_VOLUNTEER_NIGHT_EXCLUSION_20260823'
          if marker not in s:
              old="""  function volunteerEmployeeAllowed(employee,role){
    return Boolean(
      employee&&
      employee.attivo!==false&&
      employee.turno!=='Amministrazione'&&
      employeeEligibleRole(employee,role)
    );
  }
"""
              new=old+"""
  // ATLAS_VOLUNTEER_NIGHT_EXCLUSION_20260823
  // Nei Buchi volontari il vincolo notte è assoluto per le proposte automatiche.
  function volunteerNightExcluded(employee,day,item){
    return Boolean(employee&&isNightItem(item,day)&&nightRestrictionActive(employee,day));
  }
  function volunteerNightExclusionReason(employee){
    return employee?.nightRestriction==='ON_REQUEST'
      ?'escluso automaticamente dalle notti (notte solo su consenso)'
      :'escluso dalle notti';
  }
"""
              if old not in s: raise SystemExit('employee helper marker missing')
              s=s.replace(old,new,1)

              old="""      .map(employee=>{
        const check=checkCandidate(employee,day,item,{manual:false,allowRo:true});
"""
              new="""      .map(employee=>{
        if(volunteerNightExcluded(employee,day,item)){
          const reason=volunteerNightExclusionReason(employee);
          reasonMap.set(reason,(reasonMap.get(reason)||0)+1);
          return null;
        }
        const check=checkCandidate(employee,day,item,{manual:false,allowRo:true});
"""
              if old not in s: raise SystemExit('direct marker missing')
              s=s.replace(old,new,1)

              old="""        employee.turno!=='RO'&&
        !excludedIds.has(employee.id)
"""
              new="""        employee.turno!=='RO'&&
        !volunteerNightExcluded(employee,day,sourceItem)&&
        !excludedIds.has(employee.id)
"""
              if old not in s: raise SystemExit('replacement marker missing')
              s=s.replace(old,new,1)

              old="""    const blocked=state.employees
      .filter(employee=>volunteerEmployeeAllowed(employee,role))
      .filter(employee=>{
"""
              new="""    const blocked=state.employees
      .filter(employee=>volunteerEmployeeAllowed(employee,role))
      .filter(employee=>!volunteerNightExcluded(employee,day,item))
      .filter(employee=>{
"""
              if old not in s: raise SystemExit('change cover marker missing')
              s=s.replace(old,new,1)

              old="""  function volunteerSundayRestRelease(employee,day,item){
    if(parseDateKey(day).getDay()!==0)return null;
"""
              new="""  function volunteerSundayRestRelease(employee,day,item){
    if(volunteerNightExcluded(employee,day,item))return null;
    if(parseDateKey(day).getDay()!==0)return null;
"""
              if old not in s: raise SystemExit('sunday marker missing')
              s=s.replace(old,new,1)

              old="""        const sourceItem=sourceItems[sourceIndex];

        removeLinkedPostNightRest(
"""
              new="""        const sourceItem=sourceItems[sourceIndex];
        if(volunteerNightExcluded(replacement,day,sourceItem))throw new Error(`${employeeName(replacement)} è escluso dalle notti e non può ricevere il turno ${normalizeCode(sourceItem)} nel cambio.`);

        removeLinkedPostNightRest(
"""
              if old not in s: raise SystemExit('apply replacement marker missing')
              s=s.replace(old,new,1)

              old="""        const coverCheck=
          checkCandidate(
            cover,
"""
              new="""        if(volunteerNightExcluded(cover,day,holeItem))throw new Error(`${employeeName(cover)} è escluso dalle notti e non può coprire il buco ${operation.role}.`);

        const coverCheck=
          checkCandidate(
            cover,
"""
              if old not in s: raise SystemExit('apply cover marker missing')
              s=s.replace(old,new,1)

              old="""        const item=volunteerAssignmentForProposal(proposal,hole,operation.role);
        const check=checkCandidate(employee,day,item,{manual:false,allowRo:true});
"""
              new="""        const item=volunteerAssignmentForProposal(proposal,hole,operation.role);
        if(volunteerNightExcluded(employee,day,item))throw new Error(`${employeeName(employee)} è escluso dalle notti e non può coprire questa richiesta.`);
        const check=checkCandidate(employee,day,item,{manual:false,allowRo:true});
"""
              if old not in s: raise SystemExit('sunday apply marker missing')
              s=s.replace(old,new,1)

              old="""        const check=
          checkCandidate(
            employee,
            day,
            item,
"""
              new="""        if(volunteerNightExcluded(employee,day,item))throw new Error(`${employeeName(employee)} è escluso dalle notti e non può coprire direttamente questa richiesta.`);

        const check=
          checkCandidate(
            employee,
            day,
            item,
"""
              if old not in s: raise SystemExit('direct apply marker missing')
              s=s.replace(old,new,1)

              old="""        const candidate={...sourceItem,id:`VOL-MANUAL-${sourceItem.id||uid()}`};
        let check=checkCandidate(target,day,candidate,{manual:true,allowRo:true});
"""
              new="""        const candidate={...sourceItem,id:`VOL-MANUAL-${sourceItem.id||uid()}`};
        if(volunteerNightExcluded(target,day,candidate))return;
        let check=checkCandidate(target,day,candidate,{manual:true,allowRo:true});
"""
              if old not in s: raise SystemExit('manual options marker missing')
              s=s.replace(old,new,1)

              old="""    const sourceItem=donorItems[sourceIndex];
    if(!['118','OP'].includes(sourceItem?.category))throw new Error('Il turno selezionato non è trasferibile da Buchi volontari.');

    const snapshot=clonePlan(state.assignments||{});
"""
              new="""    const sourceItem=donorItems[sourceIndex];
    if(!['118','OP'].includes(sourceItem?.category))throw new Error('Il turno selezionato non è trasferibile da Buchi volontari.');
    if(volunteerNightExcluded(target,day,sourceItem))throw new Error(`${employeeName(target)} è escluso dalle notti e non può ricevere questo turno.`);

    const snapshot=clonePlan(state.assignments||{});
"""
              if old not in s: raise SystemExit('manual apply marker missing')
              s=s.replace(old,new,1)

              p.write_text(s,encoding='utf-8')
              for name in ['admin.html','ro.html']:
                  h=Path(name); t=h.read_text(encoding='utf-8')
                  t=t.replace('atlas/js/atlas-app.js?v=1.0.0-MGSE-DAILY-PREFERRED-20260823','atlas/js/atlas-app.js?v=1.0.0-VOL-NIGHT-EXCLUSION-20260823')
                  h.write_text(t,encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check atlas/js/atlas-app.js
          test "$(grep -c 'ATLAS_VOLUNTEER_NIGHT_EXCLUSION_20260823' atlas/js/atlas-app.js)" -eq 1
          grep -q "!volunteerNightExcluded(employee,day,sourceItem)" atlas/js/atlas-app.js
          grep -q "volunteerNightExcluded(replacement,day,sourceItem)" atlas/js/atlas-app.js
          grep -q "volunteerNightExcluded(cover,day,holeItem)" atlas/js/atlas-app.js
          grep -q "volunteerNightExcluded(target,day,candidate)" atlas/js/atlas-app.js
          grep -q "volunteerNightExcluded(target,day,sourceItem)" atlas/js/atlas-app.js
          git diff --check

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/js/atlas-app.js admin.html ro.html
          if ! git diff --cached --quiet; then
            git commit -m "ATLAS: block night-excluded staff in volunteer coverage changes"
            git push origin HEAD:atlas/volunteer-night-exclusion-safe-20260823
          fi
