name: Temporary apply volunteer GRO GRS fallback

on:
  push:
    branches:
      - atlas/volunteer-gro-grs-fallback-20260823
    paths:
      - .github/scripts/apply-volunteer-gro-grs-fallback.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted patch
        run: python .github/scripts/apply-volunteer-gro-grs-fallback.py
      - name: Validate JavaScript syntax
        run: |
          node --check atlas/js/atlas-app.js
          node --check atlas/js/volunteer-coverage.js
          node --check atlas/js/volunteer-night-guard.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/js/atlas-app.js atlas/js/volunteer-coverage.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ATLAS: use GRO and GRS as last-resort volunteer coverage"
          git push
