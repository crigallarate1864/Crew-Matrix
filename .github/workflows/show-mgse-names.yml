name: Show MGSE names in coverage

on:
  push:
    branches:
      - atlas/mgse-settings-coverage-20260823
    paths:
      - .github/workflows/show-mgse-names.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/mgse-settings-coverage-20260823
          fetch-depth: 0
      - name: Show MGSE assignees in compact and expanded coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('atlas/js/atlas-app.js')
          s=p.read_text(encoding='utf-8')
          old='''          <div class="coverage-se-chip ${se.tone}"><span>MGSE</span><b>${se.count}/${se.target}</b><small>${esc(se.label)}</small></div>'''
          new='''          <div class="coverage-se-chip ${se.tone}" title="${esc(seNames||se.label)}"><span>MGSE</span><b>${se.count}/${se.target}</b><small>${seNames?esc(seNames):esc(se.label)}</small></div>'''
          if old not in s:
              raise SystemExit('MGSE summary marker not found')
          s=s.replace(old,new,1)
          old2='''        <div class="coverage-day-detail">\n          ${se.reduced?`<div class="coverage-priority-note">118 prioritario · MGSE ridotto a ${se.count}/${se.target}. ${seNames?`Presenti: ${esc(seNames)}.`:'Nessuna risorsa MGSE disponibile dopo la copertura 118.'}</div>`:''}'''
          new2='''        <div class="coverage-day-detail">\n          ${!isWeekend(d)?`<div class="coverage-priority-note ${se.tone==='bad'?'danger':''}"><strong>MGSE:</strong> ${seNames?esc(seNames):'nessun dipendente assegnato'} · ${se.count}/${se.target}</div>`:''}\n          ${se.reduced?`<div class="coverage-priority-note">118 prioritario · MGSE ridotto a ${se.count}/${se.target}. ${seNames?`Presenti: ${esc(seNames)}.`:'Nessuna risorsa MGSE disponibile dopo la copertura 118.'}</div>`:''}'''
          if old2 not in s:
              raise SystemExit('MGSE detail marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check atlas/js/atlas-app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/js/atlas-app.js
          git commit -m "ATLAS: show MGSE assignees in coverage"
          git pull --rebase origin atlas/mgse-settings-coverage-20260823
          git push origin HEAD:atlas/mgse-settings-coverage-20260823
